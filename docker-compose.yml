services:
  backend:
    build:
      context: ./compiler
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:7070"
    volumes:
      - ./compiler:/app
      - gradle-cache:/root/.gradle
    command: ./gradlew runServer

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  gradle-cache: